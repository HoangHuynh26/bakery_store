services:
  postgres:
    image: postgres:16-alpine
    container_name: maison_douce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-maison_douce_bakery}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-maison_douce_bakery}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maison_douce_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maison_douce_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-maison_douce_bakery}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - maison_douce_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maison_douce_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "5173:80"
    networks:
      - maison_douce_network

volumes:
  postgres_data:
    driver: local

networks:
  maison_douce_network:
    driver: bridge
